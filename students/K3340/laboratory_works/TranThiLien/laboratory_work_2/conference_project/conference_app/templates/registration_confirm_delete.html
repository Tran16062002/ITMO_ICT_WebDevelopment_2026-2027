<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление заявки</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; color: #333; text-align: center; }
        h1 { color: #c0392b; }
        .warning-box {
            background: #fdedec; border: 2px solid #e74c3c; border-radius: 6px;
            padding: 24px 28px; margin: 20px 0;
        }
        .warning-box p { margin: 8px 0; font-size: 16px; }
        .report-name { font-weight: bold; color: #c0392b; }
        .btn { display: inline-block; padding: 10px 24px; text-decoration: none; border-radius: 4px; font-size: 14px; border: none; cursor: pointer; margin: 0 6px; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #ecf0f1; color: #333; }
        .btn-secondary:hover { background: #d5dbdb; }
    </style>
</head>
<body>
    <h1>⚠️ Подтверждение удаления</h1>

    <div class="warning-box">
        <p>Вы действительно хотите удалить заявку:</p>
        <p class="report-name">"{{ object.report_title }}"</p>
        <p style="color: #888; font-size: 14px;">Это действие нельзя отменить.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'conference_detail' object.conference.id %}" class="btn btn-secondary">Отмена</a>
    </form>
</body>
</html>
