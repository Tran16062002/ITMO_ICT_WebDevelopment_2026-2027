<!DOCTYPE html>
<html>
<head><title>{{ conference.title }}</title></head>
<body>
    <h1>{{ conference.title }}</h1>
    <p><strong>Chủ đề:</strong> {{ conference.topics }}</p>
    <p><strong>Địa điểm:</strong> {{ conference.venue }}</p>
    <p><strong>Thời gian:</strong> {{ conference.start_date }} — {{ conference.end_date }}</p>
    <p><strong>Mô tả:</strong> {{ conference.description }}</p>
    <p><strong>Mô tả địa điểm:</strong> {{ conference.venue_desc }}</p>
    <p><strong>Điều kiện:</strong> {{ conference.conditions }}</p>
</body>
</html>
